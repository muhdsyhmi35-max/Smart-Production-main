  </defs>
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <rect x="5" y="5" width="22" height="22" rx="5" fill="none" stroke="#334155" stroke-width="1.25" opacity="0.85"/>
  <!-- Production bars -->
  <rect x="8" y="19" width="5" height="7" rx="1.2" fill="url(#bar)" opacity="0.92"/>
  <rect x="13.5" y="14" width="5" height="12" rx="1.2" fill="url(#bar)"/>
  <rect x="19" y="9" width="5" height="17" rx="1.2" fill="url(#bar)" opacity="0.92"/>
